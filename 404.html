<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Meridian</title>
  <!-- Absolute paths: nginx can serve this page from any URL. -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span>Meridian</span>
      </a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
        <span></span>
      </label>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="error-page">
      <div class="container">
        <p class="error-code">404</p>
        <h1>That page isn't here</h1>
        <p class="lede">The link may be old, or the address may have a typo in it.</p>
        <div class="button-row">
          <a class="button button-primary" href="/index.html">Back to home</a>
          <a class="button button-ghost" href="/contact.html">Report a broken link</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="copyright">© 2026 Meridian Example. Built with HTML and CSS.</p>
    </div>
  </footer>
</body>
</html>
